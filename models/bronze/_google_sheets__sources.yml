version: 2

sources:
  - name: google_sheets
    #database: "{{ env_var('DBT_BRONZE_DB') }}"
    database: DEV_BRONZE_DB
    schema: google_sheets
    tables:
      - name: budget
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null

          - name: product_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('sql_server_dbo', 'products')
                    field: product_id

      #- name: slv_google_sheets_budget
      #  columns:
          - name: quantity
            data_tests:
              - positive_values:
                  arguments:
                    value: 0